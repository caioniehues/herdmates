name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Issue #127: cross-compare the subcommand seams (dispatch arms vs help
      # text vs plugin manifest). Both drifted for real during the v3.0.0 wave.
      - run: bash scripts/check-subcommand-seams.sh
      # Issue #127: boundary-crossing seams (docs/agents/boundary-pairs.md) —
      # currently just the ADR-0004 cd-in-prompt-text anti-pattern grep.
      - run: bash scripts/check-boundary-seams.sh
      # Same seam class, sidebar tokens: src/tokens.rs publishes names,
      # docs/sidebar-rows.toml renders them, and BOTH failure directions are
      # silent (a token with no row renders nowhere; a row with no producer
      # makes reload-config return "partial" and keep the old layout). Caught
      # `$model` published with no row on its first run.
      - run: bash scripts/check-token-seams.sh
